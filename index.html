<!doctype html>
<html lang="es-419">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Eco CVC</title>
  <meta name="description" content="Eco CVC: simulador educativo de acceso venoso central yugular interno guiado por ecografía, con técnica de Seldinger. No es consejo médico.">
  <meta name="theme-color" content="#cde6fc">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230a1d37' stroke='%2332e38c' stroke-width='2'/><ellipse cx='13' cy='17' rx='6' ry='4' fill='none' stroke='%2332e38c' stroke-width='2'/><circle cx='22' cy='19' r='3' fill='none' stroke='%2332e38c' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- La escena 3D ocupa toda la pantalla; los paneles flotan encima -->
  <canvas id="canvas-cuello" class="gl-canvas" aria-label="Vista externa del cuello: arrastra la sonda" data-i18n-aria="hud.cuello"></canvas>
  <div id="etiquetas-cuello" class="labels"></div>

  <div class="hud visible">
    <!-- Barra superior -->
    <header class="topbar panel">
      <span class="brand">Eco CVC</span>
      <span id="chip-caso" class="chip-static hide-narrow"></span>
      <span id="chip-examen" class="chip-static exam-chip" hidden data-i18n="hud.examen">EXAMEN</span>
      <span id="chip-demo" class="demo-badge" hidden>DEMO</span>
      <span class="sep hide-narrow"></span>
      <span class="muted" data-i18n="hud.fase">Fase</span><span id="fase-actual" class="val"></span>
      <span class="muted hide-narrow" data-i18n="hud.tiempo">Tiempo</span><span id="tiempo" class="val mono"></span>
      <span class="spacer"></span>
      <span id="selector-idioma"></span>
      <button id="boton-ayuda" class="chip" data-a="help" data-i18n="hud.ayuda">? Ayuda</button>
      <button id="boton-reiniciar" class="chip" data-i18n="hud.reiniciar">Reiniciar</button>
      <button id="boton-terminar" class="chip end" hidden data-i18n="hud.terminar">Terminar</button>
    </header>

    <!-- Columna izquierda: procedimiento y herramienta actual -->
    <div class="col col-left">
      <section id="checklist" class="panel checklist" aria-label="Procedimiento" data-i18n-aria="panel.procedimiento">
        <div class="panel-title"><span data-i18n="panel.procedimiento">Procedimiento</span><span id="progreso-pasos" class="mono"></span></div>
        <div id="pasos"></div>
      </section>

      <section class="panel device" aria-label="Herramienta" data-i18n-aria="panel.herramienta">
        <div class="panel-title" id="titulo-herramienta">Sonda</div>

        <!-- Sonda: siempre disponible -->
        <div class="dev-grupo grupo-sonda">
          <label class="fila-control">
            <span class="muted" data-i18n="ctrl.compresion">Compresión</span>
            <input type="range" id="compresion" min="0" max="100" step="1" value="0">
            <output id="valor-compresion" class="mono"></output>
          </label>
          <div class="fila-chips">
            <button id="boton-valsalva" class="chip">Valsalva</button>
            <span id="lectura-sonda" class="small muted mono"></span>
          </div>
        </div>

        <!-- Aguja -->
        <div class="dev-grupo" id="controles-aguja" hidden>
          <label class="fila-control">
            <span class="muted" data-i18n="ctrl.angulo">Ángulo</span>
            <input type="range" id="angulo-aguja">
            <output id="valor-angulo-aguja" class="mono"></output>
          </label>
          <label class="fila-control">
            <span class="muted" data-i18n="ctrl.direccion">Dirección</span>
            <input type="range" id="orientacion-aguja">
            <output id="valor-orientacion-aguja" class="mono"></output>
          </label>
          <div class="dev-controls">
            <button id="boton-retirar" class="hold">◀ S</button>
            <button id="boton-avanzar" class="hold">W ▶</button>
          </div>
          <span id="lectura-aguja" class="small muted"></span>
        </div>

        <!-- Guía, dilatador y catéter -->
        <div class="dev-grupo" id="controles-seldinger" hidden>
          <div class="dev-controls">
            <button id="boton-menos" class="hold"></button>
            <button id="boton-mas" class="hold"></button>
          </div>
          <div class="fila-chips">
            <button id="accion-principal" class="btn small"></button>
            <button id="accion-confirmar" class="btn small" data-i18n="ctrl.confirmar">Confirmar guía en la ecografía</button>
          </div>
          <span id="lectura-seldinger" class="small muted"></span>
        </div>
      </section>
    </div>

    <!-- Columna derecha: ecógrafo, mentor y monitor -->
    <div class="col col-right">
      <section class="panel ecografo" aria-label="Ecógrafo" data-i18n-aria="panel.ecografo">
        <div class="eco-head">
          <span class="panel-title" data-i18n="panel.ecografo">Ecógrafo</span>
          <span class="spacer"></span>
          <button id="boton-girar" class="chip" title="Tecla R" data-i18n-title="eco.girarTitulo" data-i18n="eco.girar">Girar 90°</button>
          <label class="chip chip-check"><input type="checkbox" id="doppler"> Doppler</label>
          <label class="chip chip-check"><input type="checkbox" id="etiquetas"> <span data-i18n="eco.etiquetas">Etiquetas</span></label>
          <label class="chip chip-check hide-narrow"><input type="checkbox" id="esquema"> <span data-i18n="eco.esquema">Esquema</span></label>
        </div>
        <div class="lienzo-us">
          <canvas id="canvas-us" aria-label="Imagen de ultrasonido" data-i18n-aria="eco.imagen"></canvas>
          <canvas id="canvas-us-overlay" aria-hidden="true"></canvas>
        </div>
        <div class="eco-ajustes">
          <label class="fila-control">
            <span class="muted" data-i18n="eco.ganancia">Ganancia</span>
            <input type="range" id="ganancia">
            <output id="valor-ganancia" class="mono"></output>
          </label>
          <label class="fila-control">
            <span class="muted" data-i18n="eco.profundidad">Profundidad</span>
            <input type="range" id="profundidad">
            <output id="valor-profundidad" class="mono"></output>
          </label>
        </div>
      </section>

      <section id="mentor" class="panel mentor" aria-label="Mentor" aria-live="polite">
        <div class="mentor-head">
          <span class="mentor-badge">MENTOR</span>
          <span id="mentor-paso" class="mentor-stage"></span>
          <span id="mentor-pct" class="mentor-pct mono"></span>
          <button id="mentor-plegar" class="mentor-toggle" aria-label="Plegar el mentor" data-i18n-aria="mentor.plegar">–</button>
        </div>
        <div class="exam-body">
          <div class="exam-clock">
            <span class="exam-left-lbl" data-i18n="examen.restante">Tiempo restante</span>
            <span id="examen-reloj" class="exam-left mono"></span>
          </div>
          <p class="exam-rules" data-i18n="examen.reglas">Sin Doppler, etiquetas, esquema ni pistas. Cuando se acaba el tiempo, el caso se cierra.</p>
          <p id="examen-vineta" class="exam-vignette"></p>
        </div>
        <div class="mentor-bar"><div id="mentor-barra"></div></div>
        <div class="mentor-body">
          <p id="mentor-objetivo" class="mentor-goal"></p>
          <ul id="mentor-tareas" class="mentor-tasks"></ul>
        </div>
        <p id="mentor-pista" class="mentor-hint" hidden></p>
        <details class="mentor-why"><summary data-i18n="mentor.porque">¿Por qué este paso?</summary><p id="mentor-porque"></p></details>
      </section>

      <section class="panel vitals" aria-label="Monitor" data-i18n-aria="panel.monitor">
        <div class="v-head">
          <span class="panel-title" data-i18n="panel.monitor">Monitor</span>
          <span id="lectura-ecg" class="v-alarm"></span>
        </div>
        <div class="v-row">
          <div class="v-wave"><span class="v-lbl">II</span><canvas id="canvas-ecg" aria-label="Electrocardiograma" data-i18n-aria="monitor.ecg"></canvas></div>
          <div class="v-num hr"><span class="v-lbl" data-i18n="monitor.fc">FC</span><span id="valor-fc" class="big mono"></span></div>
        </div>
      </section>
    </div>

    <!-- Barra de herramientas: una por paso del procedimiento -->
    <nav id="barra-herramientas" class="toolbar panel" aria-label="Pasos del procedimiento" data-i18n-aria="panel.pasos"></nav>

    <!-- Mensajes breves -->
    <div id="avisos" class="toasts" aria-live="polite"></div>
  </div>

  <!-- Pantalla de inicio -->
  <div id="inicio" class="start-screen ss" hidden></div>

  <!-- Evaluación final -->
  <div id="evaluacion" class="debrief" hidden>
    <section class="debrief-card" role="dialog" aria-modal="true" aria-labelledby="titulo-evaluacion">
      <p class="eyebrow" data-i18n="eval.titulo">EVALUACIÓN</p>
      <div class="db-top">
        <div class="db-score"><span id="puntaje" class="db-num mono"></span><span class="db-of">/100</span></div>
        <div>
          <span id="veredicto" class="db-verdict"></span>
          <h2 id="titulo-evaluacion"></h2>
        </div>
      </div>
      <p id="caso-evaluado" class="db-case"></p>
      <p id="mejor-marca" class="db-best" hidden></p>
      <ul id="items-evaluacion" class="db-items"></ul>
      <p id="claves-caso" class="claves-caso"></p>
      <div class="db-actions">
        <button id="otro-caso" class="btn" data-i18n="eval.otro">Elegir otro paciente</button>
        <button id="repetir-caso" class="btn-primary" data-i18n="eval.repetir">Repetir este caso</button>
      </div>
    </section>
  </div>

  <noscript>Eco CVC necesita JavaScript y WebGL.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
